      if (item.first && res.firstOk !== false) S.firstRight++;
      state.stats.correct++;
      state.stats.maxCombo = Math.max(state.stats.maxCombo, S.combo);
      questEvent("correct", 1);
      questEvent("combo", S.combo, true);
      if ((S.mode === "practice" || S.mode === "mistakes") && state.mistakes[item.ex.key]) { delete state.mistakes[item.ex.key]; state.stats.fixed++; }
      sfx("good", S.combo);
      setFoot("good", { title: pick(PRAISE), why: fromMatch ? (S.matchMisses ? "Minden pár a helyén." : "Elsőre minden párt eltaláltál!") : item.ex.why });
      burstAt(S.ctrl.anchor && S.ctrl.anchor(), { n: 16, colors: [cssVar("--good-btn"), cssVar("--sun"), cssVar("--uc", lessonEl)] });
      if (COMBO_MILESTONES.has(S.combo)) comboPop(S.combo);
    } else {
      S.mistakes++;
      S.combo = 0;
      item.first = false;
      state.mistakes[item.ex.key] = Date.now();
      if (S.M.requeue) S.queue.push({ kind: "ex", ex: item.ex, first: false });
      if (S.M.hearts) { loseHeart(); S.hearts = heartsNow(); }
      if (S.M.allowed != null) S.left--;
      sfx("bad");
      buzz(90);
      retrigger(lessonEl, "flash");
      updateHearts(true);
      setFoot("bad", { title: pick(OOPS), answer: res.answer, why: item.ex.why });
    }
    S.touched = true;
    save();
    setCombo(res.ok);
    updateBar(res.ok);
    actBtn.focus({ preventScroll: true });
    if (S.M.timed) later(() => { if (S.answered && footMode !== "idle") next(); }, res.ok ? 650 : 1500);
  }
  function next() {
    if (!S || S.busy) return;
    if (S.M.hearts && S.hearts <= 0) { showFail("hearts"); return; }
    if (S.M.allowed != null && S.left < 0) { showFail("lives"); return; }
    if (S.timeUp) { leaveStage(finish); return; }
    S.pos++;
    if (S.M.timed && S.pos >= S.queue.length) { S.queue.push(...shuffle(S.queue.filter((q) => q.kind === "ex")).map((q) => ({ kind: "ex", ex: q.ex, first: false }))); }
    const end = S.pos >= S.queue.length;
    leaveStage(() => (end ? finish() : showStep()));
  }
  // A régi feladat kicsúszik balra, mielőtt az új beúszik jobbról.
  function leaveStage(cb) {
    if (REDUCED) { cb(); return; }
    S.busy = true;
    stage.classList.add("leaving");
    later(() => { S.busy = false; cb(); }, 170);
  }

  function finish() {
    clearInterval(timerInt);
    const L = S.L, mode = S.mode, timed = !!S.M.timed;
    const acc = timed ? (S.answeredN ? S.correct / S.answeredN : 0) : S.total ? S.firstRight / S.total : 1;
    const stars = acc >= 0.9 ? 3 : acc >= 0.7 ? 2 : 1;
    const perfect = !timed && S.total > 0 && S.firstRight === S.total;
    let base = { lesson: 10, exam: 25, practice: 10, mistakes: 10, legendary: 20, jump: 15 }[mode] || 0;
    if (timed) base = S.correct;
    if (perfect && (mode === "lesson" || mode === "exam")) base += 5;
    const beforeToday = todayXp();
    const boosted = boostActive();
    const gained = base ? addXp(base) : 0;
    const streak = extendStreak();
    let gems = { lesson: 2, exam: 10, legendary: 5, jump: 5, practice: 1, mistakes: 1 }[mode] || 0;
    if (timed) gems = Math.min(5, Math.floor(S.correct / 4));
    if (perfect) gems += 2;
    addGems(gems);
    const firstTime = L && !isDone(S.i);
    if (mode === "lesson" || mode === "exam" || mode === "legendary") {
      state.done[L.id] = (state.done[L.id] || 0) + 1;
      state.best[L.id] = Math.max(state.best[L.id] || 0, stars);
      state.stats.lessons++;
      questEvent("lessons", 1);
      if (perfect) { state.stats.perfect++; questEvent("perfect", 1); }
      if (acc >= 0.9) questEvent("acc90", 1);
    }
    if (mode === "legendary") state.legend[L.id] = true;
    if (mode === "practice" || mode === "mistakes" || timed) { state.stats.practice++; questEvent("practice", 1); }
    if (mode === "practice" && !INFINITE_HEARTS) gainHearts(1);
    if (timed) state.stats.timedBest = Math.max(state.stats.timedBest, S.correct);
    let unlock = null;
    if (mode === "jump") {
      LESSONS.forEach((l, i) => { if (CH_POS[chapterOf(l)] < CH_POS[S.chapter] && !isDone(i)) { state.done[l.id] = 1; state.best[l.id] = state.best[l.id] || 1; } });
      unlock = LESSON_POS[lessonsOfChapter(S.chapter)[0].id];
      prefs.chapter = S.chapter;
    } else if (firstTime && (mode === "lesson" || mode === "exam") && S.i + 1 < LESSONS.length) {
      unlock = S.i + 1;
      prefs.chapter = chapterOf(LESSONS[unlock]);
    }
    const newAch = checkAch();
    save();
    savePrefs();
    S.homeFx = { xpFrom: S.xpBefore, unlock, streakUp: !!streak };
    if (streak) S.post.push({ type: "streak", ...streak });
    ensureQuests();
    if (state.quests.list.some((q, i) => q.prog !== S.questsBefore[i])) S.post.push({ type: "quests", before: S.questsBefore });
    if (newAch.length) S.post.push({ type: "ach", list: newAch });

    $("lTop").hidden = true;
    $("combo").replaceChildren();
    const titles = { lesson: perfect ? "Hibátlan lecke!" : "Lecke teljesítve!", exam: "Vizsga kész!", practice: "Gyakorlás kész!", mistakes: "Szép javítás!", legendary: "Aranyba fordult!", jump: "Átmentél a szintfelmérőn!", timed: "Lejárt az idő!" };
    const perks = el("div", { class: "perks" });
    if (gems) perks.append(el("div", { class: "perk", style: "color:var(--gem)" }, icon("gem"), "+" + gems + " drágakő"));
    if (beforeToday < state.goal && beforeToday + gained >= state.goal) perks.append(el("div", { class: "perk", style: "color:var(--brand)" }, icon("target"), "Teljesítetted a mai célt!"));
    if (unlock != null && mode !== "jump") perks.append(el("div", { class: "perk", style: "color:var(--ink-soft)" }, icon("spark"), "Megnyílt: " + LESSONS[unlock].title));
    if (mode === "jump") perks.append(el("div", { class: "perk", style: "color:var(--blue)" }, icon("flag"), "Megnyílt a(z) " + (CH_POS[S.chapter] + 1) + ". fejezet"));
    if (mode === "legendary") perks.append(el("div", { class: "perk", style: "color:var(--legend-deep)" }, icon("goldsnake"), "Arany állomás a térképen"));
    if (mode === "practice" && !INFINITE_HEARTS) perks.append(el("div", { class: "perk", style: "color:var(--heart)" }, icon("heart"), "+1 szív"));
    if (timed && S.correct >= state.stats.timedBest && S.correct > 0) perks.append(el("div", { class: "perk", style: "color:var(--blue)" }, icon("trophy"), "Új rekord!"));
    const pctAcc = Math.round(acc * 100);
    const xpVal = el("span", null, "+" + (REDUCED ? gained : 0));
    const accVal = el("span", null, timed ? (REDUCED ? S.correct : 0) : (REDUCED ? pctAcc : 0) + "%");
    const starsEl = timed ? null : starsRow(stars, "big-stars");
    stage.classList.remove("leaving");
    stage.replaceChildren(el("div", { class: "l-inner result", style: "animation:none" },
      tekla("happy"),
      el("h2", null, titles[mode]),
      starsEl,
      el("div", { class: "tiles3" },
        el("div", { class: "st", style: "--tc:var(--sun-deep)" }, el("span", null, boosted ? "XP · 2×" : "XP"), el("b", null, icon("bolt"), xpVal)),
        el("div", { class: "st", style: "--tc:var(--good-btn)" }, el("span", null, timed ? "Helyes" : "Pontosság"), el("b", null, accVal)),
        el("div", { class: "st", style: "--tc:var(--blue)" }, el("span", null, timed ? "Rekord" : "Idő"), el("b", null, timed ? String(state.stats.timedBest) : fmtTime(Date.now() - S.start)))),
      perks));
    lBody.scrollTop = 0;
    setFoot("result");
    sfx("win");
    later(() => fx.confetti(), 200);
    if (starsEl) [...starsEl.children].slice(0, stars).forEach((s, k) => later(() => {
      sfx("star", k);
      burstAt(s, { n: 12, speed: 0.9, colors: [cssVar("--sun"), cssVar("--flame"), "#FFFFFF"] });
    }, 760 + k * 300));
    later(() => countUp(xpVal, 0, gained, 600, (v) => "+" + v, () => sfx("tick")), 1400);
    later(() => countUp(accVal, 0, timed ? S.correct : pctAcc, 700, (v) => (timed ? String(v) : v + "%")), 1500);
    actBtn.focus({ preventScroll: true });
  }

  function showPost() {
    const p = S.post.shift();
    if (!p) { closeLesson(); return; }
    stage.style.animation = "none";
    void stage.offsetWidth;
    stage.style.animation = "";
    lBody.scrollTop = 0;
    setFoot("post");
    if (p.type === "streak") {
      const num = el("div", { class: "streak-num" }, REDUCED ? p.to : p.from);
      const flame = el("div", { class: "streak-flame" }, icon("flame"));
      stage.replaceChildren(el("div", { class: "l-inner streak-screen", style: "animation:none" }, flame, num,
        el("h2", null, "napos széria!"),
        el("p", { class: "muted" }, p.to === 1 ? "Elindult a szériád! Gyere vissza holnap is, hogy nőjön." : "Ma is gyakoroltál. Gyere vissza holnap is, hogy ne szakadjon meg!"),
        weekRow(),
        p.reward ? el("div", { class: "milestone" }, icon("medal"), el("div", null, el("b", null, p.to + " napos mérföldkő!"), el("span", { class: "small" }, "Jutalom: " + p.reward + " drágakő"))) : null,
        el("p", { class: "note" }, state.freezes ? "Széria-befagyasztó felszerelve: " + state.freezes + "/" + FREEZE_MAX : "Tipp: egy széria-befagyasztó megvédi a szériád, ha kihagysz egy napot.")));
      sfx("flame");
      later(() => { countUp(num, p.from, p.to, 500, String); burstAt(flame, { n: 20, speed: 1.2, colors: [cssVar("--flame"), cssVar("--sun"), "#FFFFFF"] }); }, 450);
      if (p.reward) later(() => { sfx("coin"); }, 1100);
    } else if (p.type === "quests") {
      const list = el("div", { class: "post-list" });
      state.quests.list.forEach((q, i) => {
        const row = questRow(q, i, { from: p.before[i], live: true });
        row.style.animationDelay = (0.15 + i * 0.12) + "s";
        list.append(row);
      });
      stage.replaceChildren(el("div", { class: "l-inner result", style: "animation:none" },
        el("h2", { style: "color:var(--ink)" }, "Napi küldetések"),
        el("p", { class: "muted" }, questsClaimable() ? "Kész küldetés! Nyisd ki a ládát a jutalomért." : "Így haladsz a mai küldetésekkel."),
        list));
      animateBars(list);
      sfx("tap");
    } else if (p.type === "ach") {
      const list = el("div", { class: "post-list" });
      p.list.forEach((n, i) => {
        const medal = el("div", { class: "ach-medal", style: "--ac:" + n.a.c }, icon("medal", "shield"), icon(n.a.icon, "inner"));
        const row = el("div", { class: "ach-unlock", style: "animation-delay:" + (0.2 + i * 0.15) + "s" }, medal,
          el("div", null, el("b", { style: "font-family:var(--f-display);font-weight:400;font-size:20px" }, n.a.name + " · " + n.tier + ". szint"),
            el("p", { class: "small muted" }, n.a.desc(n.a.tiers[n.tier - 1])),
            el("span", { class: "small", style: "color:var(--gem);font-weight:700" }, "+" + 10 * n.tier + " drágakő")));
        list.append(row);
        later(() => burstAt(medal, { n: 12, colors: [cssVar("--sun"), cssVar("--gem"), "#FFFFFF"] }), 450 + i * 150);
      });
      stage.replaceChildren(el("div", { class: "l-inner result", style: "animation:none" }, tekla("happy"), el("h2", null, "Új eredmény!"), list));
      sfx("chest");
    }
    actBtn.focus({ preventScroll: true });
  }

  function showFail(kind) {
    clearInterval(timerInt);
    stage.classList.remove("leaving");
    $("combo").replaceChildren();
    const hearts = kind === "hearts";
    stage.replaceChildren(el("div", { class: "l-inner result fail", style: "animation:none" },
      tekla("sad"),
      el("h2", null, hearts ? "Elfogytak a szívek" : "Túl sok hiba"),
      el("p", { class: "note", style: "font-size:17px;max-width:420px" }, hearts ? "Semmi baj, a hibákból tanulunk! Tölts fel szíveket, gyakorolj egyet, vagy várj, amíg visszatöltődnek." : "Ez most nem jött össze, de bármikor újrapróbálhatod.")));
    if (hearts) setFoot("fail", state.gems >= PRICE.refill ? { act: "Feltöltés · " + PRICE.refill + " drágakő", cls: "gem" } : { act: "Gyakorlás +1 szív", cls: "good" });
    else setFoot("fail", { act: "Újrapróbálom", cls: "good" });
    S.failKind = kind;
    sfx("lose");
    S.failed = true;
    actBtn.focus({ preventScroll: true });
  }

  function closeLesson() {
    clearInterval(timerInt);
    const homeFx = S && S.homeFx, ret = S ? S.returnView : "learn";
    S = null;
    lessonEl.hidden = true;
    appEl.hidden = false;
    tabbar.hidden = false;
    prefs.view = homeFx && (homeFx.unlock != null || ret === "learn") ? "learn" : ret;
    render();
    window.scrollTo(0, 0);
    if (homeFx) playHomeFx(homeFx);
    setTimeout(showNotices, 400);
    if (NET.pendingRemote) { const r = NET.pendingRemote; NET.pendingRemote = null; if (remoteWins(r, state)) takeServerState(r); }
  }
  // Lecke után: az XP felpörög, és az újonnan megnyílt állomás lakatja lepattan.
  function playHomeFx(f) {
    document.querySelectorAll(".chip-btn.gem, .chip-btn.flame").forEach((c) => retrigger(c, "bump"));
    if (f.unlock == null || prefs.view !== "learn") return;
    const btn = document.querySelector('.node[data-i="' + f.unlock + '"]');
    if (!btn) return;
    if (REDUCED) { sfx("unlock"); return; }
    const real = [...btn.childNodes];
    const tip = btn.parentElement.querySelector(".start-tip");
    const wasCurrent = btn.classList.contains("current");
    btn.classList.add("locked");
    btn.classList.remove("current");
    btn.replaceChildren(icon(LESSONS[f.unlock].exam ? "trophy" : "lock"));
    if (tip) tip.style.visibility = "hidden";
    setTimeout(() => { if (btn.isConnected) btn.scrollIntoView({ block: "center", behavior: "smooth" }); }, 150);
    setTimeout(() => { if (!btn.isConnected || S) return; btn.classList.add("unlocking"); sfx("unlock"); }, 750);
    setTimeout(() => {
      if (!btn.isConnected) return;
      btn.classList.remove("locked");
      if (wasCurrent) btn.classList.add("current");
      btn.replaceChildren(...real);
      if (!S) burstAt(btn, { n: 18, speed: 1.2, colors: [cssVar("--uc", btn), cssVar("--sun"), "#FFFFFF"] });
      if (tip) {
        tip.style.visibility = "";
        animate(tip, [{ opacity: 0, transform: "scale(.4)" }, { opacity: 1, transform: "none" }], { duration: 420, easing: "cubic-bezier(.2,1.6,.4,1)" });
      }
      drawSnakes();
    }, 1180);
    setTimeout(() => btn.classList.remove("unlocking"), 1750);
  }
  function askQuit() {
    if (!S) return;
    if (S.failed || footMode === "result" || footMode === "post" || (!S.touched && S.pos === 0)) {
      if (footMode === "result" || footMode === "post") { S.post = []; }
      closeLesson();
      return;
    }
    openSheet(lessonEl.getAttribute("style"),
      tekla("sad"),
      el("h3", { id: "sheetTitle" }, "Biztos kilépsz?"),
      el("p", { class: "meta" }, "Ha most kilépsz, ennek a" + (S.mode === "lesson" ? " leckének" : "z alkalomnak") + " a haladása elvész."),
      el("div", { class: "row" },
        el("button", { class: "btn", type: "button", onclick: closeSheet }, "Folytatom"),
        el("button", { class: "btn ghost", type: "button", onclick: () => { closeSheet(); closeLesson(); } }, "Kilépek")));
    sheetIn.querySelector(".tekla").style.cssText = "width:90px;height:90px";
  }

  actBtn.addEventListener("click", () => {
    if (!S) return;
    if (footMode === "idle") check(false);
    else if (footMode === "tip" || footMode === "good" || footMode === "bad") next();
    else if (footMode === "result" || footMode === "post") showPost();
    else if (footMode === "fail") {
      const cfg = { mode: S.mode, i: S.i, chapter: S.chapter };
      if (S.failKind === "hearts") {
        if (state.gems >= PRICE.refill) { spend(PRICE.refill); state.hearts = HEART_MAX; save(); sfx("coin"); startSession(cfg); }
        else startSession({ mode: "practice" });
      } else startSession(cfg);
    }
  });
  altBtn.addEventListener("click", () => { if (footMode === "fail") closeLesson(); });
  $("quitBtn").addEventListener("click", askQuit);

  document.addEventListener("keydown", (e) => {
    if (!sheet.hidden) {
      if (e.key === "Escape") { e.preventDefault(); closeSheet(); }
      return;
    }
    if (popOpen && e.key === "Escape") { e.preventDefault(); closePop(); return; }
    if (lessonEl.hidden || !S) return;
    if (e.key === "Escape") { e.preventDefault(); askQuit(); return; }
    if (e.key === "Enter") {
      if (e.target && e.target.classList && (e.target.classList.contains("tile") || e.target.classList.contains("slot") || e.target.classList.contains("q-chest"))) return;
      e.preventDefault();
      if (!actBtn.disabled) actBtn.click();
      return;
    }
    const typing = e.target && e.target.tagName === "INPUT";
    if (!typing && /^[1-9]$/.test(e.key) && S.ctrl && S.ctrl.pickIndex && !S.answered) {
      e.preventDefault();
      S.ctrl.pickIndex(Number(e.key) - 1);
    }
  });

  // ===================== Boot =====================
  let lastDayKey = today();
  function tick() {
    const t = today();
    if (t !== lastDayKey) {
      lastDayKey = t;
      ensureQuests();
      settleStreak();
      rollWeek(leagueMode());
      if (!S) { render(); showNotices(); }
      return;
    }
    const chip = document.querySelectorAll(".boost-left");
    if (chip.length) {
      if (!boostActive()) { if (!S) { renderChips(); renderRail(); } }
      else chip.forEach((c) => (c.textContent = "2× " + fmtClock(state.boostUntil - Date.now())));
    }
  }
  function start(data) {
    if (data && data.state) state = normalize(data.state);
    else loadLocal();
    if (data && data.prefs) prefs = { ...prefs, ...data.prefs };
    applyTheme();
    applySkin();
    buildShell();
    ensureQuests();
    syncHearts();
    settleStreak();
    const hasRuntime = !!(window.claude && typeof window.claude.use === "function");
    // A fiókot már a kapcsolódás előtt ismerjük, hogy a hetet ne a gépi ellenfelek alapján zárjuk le.
    if (!hasRuntime) { try { NET.token = localStorage.getItem(ACCOUNT_KEY); } catch (e) {} }
    const hashView = (location.hash || "").slice(1);
    const fromHash = { tanulas: "learn", gyakorlas: "practice", liga: "league", kuldetesek: "quests", bolt: "shop", profil: "profile" }[hashView];
    if (["jogi", "impresszum", "adatvedelem", "sutik", "feltetelek"].includes(hashView)) openLegal(hashView === "jogi" ? null : hashView);
    else go(fromHash || prefs.view || "learn");
    setTimeout(showNotices, 500);
    setInterval(tick, 1000);
    // claude.ai-on az artifact futtatókörnyezete, saját domainen a Cloudflare Worker adja az online részt.
    (hasRuntime ? connectRemote() : connectServer()).then(() => {
      rollWeek(leagueMode());
      if (!S && !popOpen) render();
      if (!S) showNotices();
    });
  }
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === "function") hot.snapshot(() => ({ state, prefs }));
  if (hot && typeof hot.ready === "function") hot.ready(start);
  else start((hot && hot.data) || {});

})();
</script>
</body></html>
