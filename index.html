/* Layout: nav rail left · learning path center · stats rail right. Phones: top stat bar + bottom tab bar.
   Identity: tactile 3D game UI, Python blue + yellow accents on leaf-tinted neutrals; the path is Tekla's own body. */
:root{
  --bg:#F2F6F2;--surface:#FFFFFF;--surface-2:#E9F0EB;--surface-3:#DAE5DE;--ink:#13291F;--ink-soft:#566E65;--ink-faint:#86A096;--line:#D2DFD7;
  --brand:#129C6B;--brand-deep:#0A744F;--brand-soft:#D3F2E4;
  --blue:#2F74C0;--blue-deep:#1F5794;--blue-soft:#DDEAFA;
  --sun:#F5B518;--sun-deep:#C08304;--sun-soft:#FFF0C7;
  --flame:#FF7A1A;--flame-deep:#CF560A;--flame-soft:#FFE7D4;
  --ice:#38A6EE;--ice-deep:#1A7DBE;--ice-soft:#DCEFFC;
  --gem:#7A5AF0;--gem-deep:#5838CB;--gem-soft:#ECE6FF;
  --heart:#EC4A57;--heart-deep:#BF2F3B;--heart-soft:#FCE1E3;
  --good-bg:#D3F4DC;--good-ink:#15703A;--good-btn:#22A447;--good-deep:#167F37;
  --bad-bg:#FCE0DE;--bad-ink:#B42B27;--bad-btn:#EC4A57;--bad-deep:#BF2F3B;
  --lock:#D7E1DB;--lock-deep:#B6C6BD;--lock-ink:#8A9F96;
  --code-bg:#0F241E;--code-ink:#E4F3EC;--code-kw:#FF9E64;--code-str:#9BE38A;--code-num:#F7C948;--code-fn:#7DC8FF;--code-com:#7A978E;--slot-bg:rgba(247,201,72,.16);
  --u1:#12A07A;--u1d:#0C7759;--u2:#2B80DA;--u2d:#1C61AB;--u3:#E79214;--u3d:#B26C04;--u4:#EE5D53;--u4d:#C04139;--u5:#D4448B;--u5d:#A22D67;--u6:#0F9EA6;--u6d:#0A767C;
  --legend:#E3A21A;--legend-deep:#A46C00;--legend-ink:#8A5A00;
  --on-color:#FFFFFF;--sheen:rgba(255,255,255,.3);--scrim:rgba(8,24,19,.5);--shadow:rgba(12,40,32,.16);
  --snake:#2FB37E;--snake-dark:#1C8A5D;--snake-belly:#F6D66B;--cheek:#FF9AA2;--eye:#FFFFFF;--pupil:#11241E;--tongue:#EC4A57;
  --f-display:"Paytone One","Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Lexend","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --top-h:60px;--tab-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1512;--surface:#13201B;--surface-2:#1A2A24;--surface-3:#23382F;--ink:#E6F2EC;--ink-soft:#9DB5AC;--ink-faint:#6E887E;--line:#263D34;
  --brand:#23BF8E;--brand-deep:#138560;--brand-soft:#123A2C;
  --blue:#5AA2EE;--blue-deep:#2C6DB5;--blue-soft:#172C44;
  --sun:#F7C64C;--sun-deep:#B88912;--sun-soft:#3A3014;
  --flame:#FF8F3D;--flame-deep:#C2601C;--flame-soft:#3D2414;
  --ice:#5BBBF5;--ice-deep:#2A86C4;--ice-soft:#13304A;
  --gem:#9A80FA;--gem-deep:#6A4CD8;--gem-soft:#251F45;
  --heart:#FF5C69;--heart-deep:#B33441;--heart-soft:#3A1C20;
  --good-bg:#15362A;--good-ink:#7BE6A0;--good-btn:#2DB85A;--good-deep:#1C8540;
  --bad-bg:#3A1C20;--bad-ink:#FF9A95;--bad-btn:#F05663;--bad-deep:#B33441;
  --lock:#24362F;--lock-deep:#182822;--lock-ink:#5E766D;
  --code-bg:#07110E;--code-ink:#E4F3EC;--code-kw:#FFA673;--code-str:#A4E893;--code-num:#F7CF5A;--code-fn:#8BD0FF;--code-com:#6E8A82;--slot-bg:rgba(247,207,90,.14);
  --u1:#18B087;--u1d:#0E7E5F;--u2:#3B90EA;--u2d:#2068B3;--u3:#EFA02A;--u3d:#B4720A;--u4:#F26C62;--u4d:#BF463D;--u5:#E25A9C;--u5d:#A8336D;--u6:#1BB3BB;--u6d:#0E8188;
  --legend:#F2B630;--legend-deep:#A97508;--legend-ink:#F5C451;
  --on-color:#FFFFFF;--sheen:rgba(255,255,255,.2);--scrim:rgba(0,0,0,.62);--shadow:rgba(0,0,0,.45);
  --snake:#3CC48D;--snake-dark:#22935F;--snake-belly:#F7D978;--cheek:#FF9AA2;--eye:#FFFFFF;--pupil:#11241E;--tongue:#FF5C69;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1512;--surface:#13201B;--surface-2:#1A2A24;--surface-3:#23382F;--ink:#E6F2EC;--ink-soft:#9DB5AC;--ink-faint:#6E887E;--line:#263D34;
  --brand:#23BF8E;--brand-deep:#138560;--brand-soft:#123A2C;
  --blue:#5AA2EE;--blue-deep:#2C6DB5;--blue-soft:#172C44;
  --sun:#F7C64C;--sun-deep:#B88912;--sun-soft:#3A3014;
  --flame:#FF8F3D;--flame-deep:#C2601C;--flame-soft:#3D2414;
  --ice:#5BBBF5;--ice-deep:#2A86C4;--ice-soft:#13304A;
  --gem:#9A80FA;--gem-deep:#6A4CD8;--gem-soft:#251F45;
  --heart:#FF5C69;--heart-deep:#B33441;--heart-soft:#3A1C20;
  --good-bg:#15362A;--good-ink:#7BE6A0;--good-btn:#2DB85A;--good-deep:#1C8540;
  --bad-bg:#3A1C20;--bad-ink:#FF9A95;--bad-btn:#F05663;--bad-deep:#B33441;
  --lock:#24362F;--lock-deep:#182822;--lock-ink:#5E766D;
  --code-bg:#07110E;--code-ink:#E4F3EC;--code-kw:#FFA673;--code-str:#A4E893;--code-num:#F7CF5A;--code-fn:#8BD0FF;--code-com:#6E8A82;--slot-bg:rgba(247,207,90,.14);
  --u1:#18B087;--u1d:#0E7E5F;--u2:#3B90EA;--u2d:#2068B3;--u3:#EFA02A;--u3d:#B4720A;--u4:#F26C62;--u4d:#BF463D;--u5:#E25A9C;--u5d:#A8336D;--u6:#1BB3BB;--u6d:#0E8188;
  --legend:#F2B630;--legend-deep:#A97508;--legend-ink:#F5C451;
  --on-color:#FFFFFF;--sheen:rgba(255,255,255,.2);--scrim:rgba(0,0,0,.62);--shadow:rgba(0,0,0,.45);
  --snake:#3CC48D;--snake-dark:#22935F;--snake-belly:#F7D978;--cheek:#FF9AA2;--eye:#FFFFFF;--pupil:#11241E;--tongue:#FF5C69;
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:400 16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;min-height:100%}
button,input{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
code{font-family:var(--f-mono);font-size:.9em;background:var(--surface-2);padding:.08em .35em;border-radius:6px}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.ic{width:24px;height:24px;flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* ---------- App shell ---------- */
.app{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr)}
.side{display:none}
.rail{display:none}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--line)}
.topbar-in{max-width:640px;margin:0 auto;height:var(--top-h);padding:0 12px;display:flex;align-items:center;gap:6px}
.course{display:flex;align-items:center;gap:8px;margin-right:auto;min-width:0;background:none;border:0;padding:4px;border-radius:12px;cursor:pointer}
.course .tekla{width:38px;height:38px}
.course b{font:400 22px/1 var(--f-display);color:var(--brand);white-space:nowrap}
.chips{display:flex;align-items:center;gap:2px}
.chip-btn{appearance:none;border:0;background:none;display:flex;align-items:center;gap:5px;padding:8px 8px;border-radius:12px;cursor:pointer;font:400 19px/1 var(--f-display);font-variant-numeric:tabular-nums}
.chip-btn:hover{background:var(--surface-2)}
.chip-btn .ic{width:24px;height:24px}
.chip-btn.flame{color:var(--flame)}
.chip-btn.flame.off{color:var(--lock-ink)}
.chip-btn.gem{color:var(--gem)}
.chip-btn.heart{color:var(--heart)}
.chip-btn.boost{color:var(--sun-deep);font-size:15px}
.inf{font-family:var(--f-body);font-weight:700;font-size:1.35em;line-height:.8}
.mini-board .b-row .nm small,.mini-board .avatar .bot{display:none}
.mini-board .b-row{grid-template-columns:20px auto minmax(0,1fr) auto;gap:10px;padding:7px 8px}
.mini-board .b-row .rank{font-size:16px}
.mini-board .avatar{width:34px;height:34px;font-size:15px}
.mini-board .b-row .xp{font-size:14px}
.chip-btn.freeze-on .ic{filter:drop-shadow(0 0 0 var(--ice))}
.main{min-width:0;padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 24px)}
.view{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:20px 24px;display:flex;flex-direction:column;gap:22px;animation:fadeIn .25s ease-out}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:640px;margin:0 auto;height:var(--tab-h);display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.tab{appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--ink-faint);font:600 10.5px/1.1 var(--f-body);letter-spacing:.02em;position:relative}
.tab .ic{width:28px;height:28px}
.tab[aria-current="page"]{color:var(--brand)}
.tab[aria-current="page"]::before{content:"";position:absolute;inset:6px 10%;border:2px solid var(--brand);background:var(--brand-soft);border-radius:14px;z-index:-1}
.tab .dot,.nav-item .dot{position:absolute;top:8px;right:calc(50% - 20px);width:10px;height:10px;border-radius:50%;background:var(--heart);box-shadow:0 0 0 2px var(--surface)}
@media (min-width:700px){
  .app{grid-template-columns:84px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding:18px 12px;border-right:2px solid var(--line);background:var(--bg)}
  .side .logo{display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 6px 18px}
  .side .logo .tekla{width:44px;height:44px}
  .side .logo b{display:none;font:400 28px/1 var(--f-display);color:var(--brand)}
  .nav-item{appearance:none;display:flex;align-items:center;justify-content:center;gap:14px;height:52px;padding:0 12px;border:2px solid transparent;border-radius:14px;background:none;cursor:pointer;color:var(--ink-soft);font:700 14px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;position:relative}
  .nav-item .ic{width:30px;height:30px}
  .nav-item span{display:none}
  .nav-item:hover{background:var(--surface-2)}
  .nav-item[aria-current="page"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
  .nav-item .dot{top:10px;right:14px}
  .tabbar{display:none}
  .main{padding-bottom:40px}
  .topbar{border-bottom:0}
}
@media (min-width:1120px){
  .app{grid-template-columns:240px minmax(0,1fr) 360px}
  .side .logo{justify-content:flex-start}
  .side .logo b{display:block}
  .nav-item{justify-content:flex-start}
  .nav-item span{display:inline}
  .topbar{display:none}
  .rail{display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 24px 24px 8px}
  .rail .chips{justify-content:space-between;padding:4px 0 2px}
  .view{padding-block:26px 24px}
}

/* ---------- Common bits ---------- */
.btn{appearance:none;border:0;border-radius:16px;padding:13px 20px;min-height:50px;font:700 15px/1.1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--on-color);background:var(--brand);box-shadow:0 4px 0 var(--brand-deep);cursor:pointer;transition:transform .06s,box-shadow .06s,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn .ic{width:20px;height:20px}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--brand-deep)}
.btn.good{background:var(--good-btn);box-shadow:0 4px 0 var(--good-deep)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-deep)}
.btn.bad{background:var(--bad-btn);box-shadow:0 4px 0 var(--bad-deep)}
.btn.sun{background:var(--sun);box-shadow:0 4px 0 var(--sun-deep);color:var(--pupil)}
.btn.gem{background:var(--gem);box-shadow:0 4px 0 var(--gem-deep)}
.btn.ice{background:var(--ice);box-shadow:0 4px 0 var(--ice-deep)}
.btn.legend{background:linear-gradient(180deg,var(--sun),var(--legend));box-shadow:0 4px 0 var(--legend-deep);color:var(--pupil)}
.btn.ghost{background:var(--surface);color:var(--blue);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.plain{background:transparent;box-shadow:none;color:var(--blue);min-height:44px}
.btn.on-color{background:var(--surface);color:var(--uc,var(--brand));box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn:disabled{background:var(--lock);color:var(--lock-ink);box-shadow:0 4px 0 var(--lock-deep);cursor:not-allowed;transform:none;filter:none;border-color:transparent}
.btn.wide{width:100%}
.btn.sm{min-height:40px;padding:9px 14px;font-size:13px;border-radius:13px}
.icon-btn{appearance:none;background:none;border:0;padding:8px;border-radius:12px;color:var(--ink-soft);cursor:pointer;display:grid;place-items:center}
.icon-btn:hover{background:var(--surface-2)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:18px}
.card.tight{padding:14px 16px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.card-head h3{font-size:21px}
.link{appearance:none;background:none;border:0;padding:4px 2px;color:var(--blue);font:700 13px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.eyebrow{font:700 12px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase}
.muted{color:var(--ink-soft)}
.small{font-size:14px}
.view-head{display:flex;flex-direction:column;gap:6px}
.view-head h1{font-size:clamp(28px,6vw,36px)}
.view-head p{color:var(--ink-soft)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 11px;font:700 12px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2);color:var(--ink-soft)}
.pill .ic{width:14px;height:14px}
.pbar{height:14px;border-radius:99px;background:var(--surface-3);overflow:hidden;position:relative}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--pc,var(--sun));transition:width .7s cubic-bezier(.3,1.2,.5,1);position:relative}
.pbar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:3px;border-radius:99px;background:var(--sheen)}
.pbar-label{position:absolute;inset:0;display:grid;place-items:center;font:700 10.5px/1 var(--f-body);color:var(--ink);letter-spacing:.04em}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:18px 8px;color:var(--ink-soft)}
.empty .tekla{width:84px;height:84px}
.avatar{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font:400 19px/1 var(--f-display);color:var(--on-color);background:var(--ac,var(--blue));overflow:hidden;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar .tekla{width:120%;height:120%;margin-top:14%}
.avatar.lg{width:88px;height:88px;font-size:38px}
.avatar .bot{position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;border-radius:50%;background:var(--surface);color:var(--ink-soft);display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface)}
.avatar .bot .ic{width:13px;height:13px}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 20px + env(safe-area-inset-bottom,0px));z-index:70;translate:-50% 0;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;box-shadow:0 8px 24px var(--shadow);animation:toastIn .3s cubic-bezier(.2,1.3,.4,1);max-width:calc(100vw - 32px)}
@media (min-width:700px){.toast{bottom:28px}}
@keyframes toastIn{from{opacity:0;transform:translateY(16px)}}

/* ---------- Learn view ---------- */
.chapter-banner{position:relative;overflow:hidden;border-radius:24px;padding:20px 20px 18px;background:var(--uc);color:var(--on-color);box-shadow:0 6px 0 var(--ucd);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center}
.chapter-banner::after{content:attr(data-num);position:absolute;right:18px;bottom:-26px;font:400 112px/1 var(--f-display);opacity:.13;pointer-events:none}
.chapter-banner .eyebrow{opacity:.9}
.chapter-banner h2{font-size:clamp(26px,6vw,32px)}
.chapter-banner p{font-size:14.5px;opacity:.93}
.chapter-banner .cb-prog{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:8px;font:700 13px/1 var(--f-body);position:relative;z-index:1}
.chapter-banner .pbar{flex:1;background:rgba(0,0,0,.18);height:12px}
.chapter-banner .pbar i{--pc:var(--sun)}
.chapter-banner .btn.on-color{position:relative;z-index:1}
.unit{display:flex;flex-direction:column}
.unit-head{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h) + 8px);z-index:6;background:var(--uc);color:var(--on-color);border-radius:18px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 5px 0 var(--ucd)}
@media (min-width:1120px){.unit-head{top:12px}}
.unit-head>div{min-width:0}
.unit-head .eyebrow{opacity:.86}
.unit-head h3{font-size:23px;margin-top:5px}
.unit-head p{font-size:13.5px;opacity:.92;margin-top:3px}
.guide{appearance:none;flex:none;background:transparent;color:var(--on-color);border:2px solid var(--sheen);border-bottom-width:4px;border-radius:14px;padding:9px 12px;font:700 12.5px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:6px}
.guide .ic{width:18px;height:18px}
.guide:hover{background:var(--sheen)}
.path{position:relative;list-style:none;margin:58px 0 18px;padding:0;display:flex;flex-direction:column;align-items:center;gap:46px}
.path-svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
.node-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateX(calc(var(--x) * min(70px, 14vw)));position:relative;z-index:1}
.node{appearance:none;border:0;width:74px;height:74px;border-radius:50%;background:var(--uc);color:var(--on-color);box-shadow:0 7px 0 var(--ucd),0 0 0 6px var(--bg);display:grid;place-items:center;cursor:pointer;position:relative;transition:transform .08s,box-shadow .08s,filter .15s}
.node .ic{width:34px;height:34px}
.node:hover{filter:brightness(1.07)}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ucd),0 0 0 6px var(--bg)}
.node.locked{background:var(--lock);box-shadow:0 7px 0 var(--lock-deep),0 0 0 6px var(--bg);color:var(--lock-ink)}
.node.locked:active{box-shadow:0 2px 0 var(--lock-deep),0 0 0 6px var(--bg)}
.node.exam{width:88px;height:88px}
.node.exam .ic{width:42px;height:42px}
.node.chest{width:66px;height:66px;border-radius:20px;background:var(--sun);box-shadow:0 6px 0 var(--sun-deep),0 0 0 6px var(--bg);color:var(--pupil)}
.node.chest.locked{background:var(--lock);box-shadow:0 6px 0 var(--lock-deep),0 0 0 6px var(--bg);color:var(--lock-ink)}
.node.chest.opened{background:var(--surface-2);box-shadow:0 6px 0 var(--surface-3),0 0 0 6px var(--bg);color:var(--ink-faint)}
.node.chest:not(.locked):not(.opened){animation:wiggle 2.4s ease-in-out infinite}
@keyframes wiggle{0%,80%,100%{transform:none}84%{transform:rotate(-8deg)}88%{transform:rotate(8deg)}92%{transform:rotate(-5deg)}96%{transform:rotate(4deg)}}
.node.done::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:4px solid var(--sun)}
.node.legend{background:radial-gradient(circle at 34% 28%,#FFE79A,var(--sun) 42%,var(--legend));color:var(--pupil);box-shadow:0 7px 0 var(--legend-deep),0 0 0 6px var(--bg)}
.node.legend::after{border-color:var(--legend-deep)}
.node.current::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:7px solid var(--uc);opacity:.3;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:.45}70%{transform:scale(1.12);opacity:0}100%{opacity:0}}
.node.unlocking{animation:unlock .95s cubic-bezier(.2,1.4,.4,1)}
@keyframes unlock{0%{transform:none}12%{transform:scale(.9) rotate(-10deg)}24%{transform:scale(.9) rotate(9deg)}36%{transform:scale(.9) rotate(-6deg)}46%{transform:scale(.85)}70%{transform:scale(1.22)}100%{transform:none}}
.start-tip{position:absolute;bottom:calc(100% + 8px);left:50%;translate:-50% 0;background:var(--surface);color:var(--uc);border:2px solid var(--line);border-radius:12px;padding:7px 12px;font:700 13px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;animation:bob 1.6s ease-in-out infinite;pointer-events:none}
.start-tip::after{content:"";position:absolute;left:50%;top:100%;translate:-50% 0;border:8px solid transparent;border-top-color:var(--line)}
@keyframes bob{50%{transform:translateY(-5px)}}
.node-label{font:600 13.5px/1.25 var(--f-body);color:var(--ink-soft);text-align:center;max-width:150px;background:var(--bg);border-radius:8px;padding:1px 6px}
.mini-stars{display:flex;gap:1px;color:var(--sun)}
.mini-stars .ic{width:15px;height:15px}
.mini-stars .off{color:var(--surface-3)}
.pop{position:absolute;z-index:8;left:50%;translate:-50% 0;width:min(330px,100%);background:var(--uc);color:var(--on-color);border-radius:20px;padding:16px;box-shadow:0 5px 0 var(--ucd),0 14px 30px var(--shadow);display:flex;flex-direction:column;gap:10px;animation:popIn .22s cubic-bezier(.2,1.3,.4,1);transform-origin:var(--ax,50%) top}
.pop.locked{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 14px 30px var(--shadow)}
.pop::before{content:"";position:absolute;bottom:100%;left:var(--ax,50%);translate:-50% 0;border:11px solid transparent;border-bottom-color:var(--uc)}
.pop.locked::before{border-bottom-color:var(--line)}
.pop h4{font-size:22px}
.pop p{font-size:14px;opacity:.92}
.pop .row{display:flex;gap:8px;flex-wrap:wrap}
.pop .row .btn{flex:1 1 140px}
@keyframes popIn{from{opacity:0;transform:scale(.85) translateY(-6px)}}
.next-chapter{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:22px 18px;border:2px dashed var(--line);border-radius:22px}
.next-chapter h3{font-size:22px}

/* chapter list sheet */
.ch-list{display:flex;flex-direction:column;gap:12px}
.ch-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center;padding:14px;border-radius:18px;border:2px solid var(--line);background:var(--surface)}
.ch-item.active{border-color:var(--uc);box-shadow:0 4px 0 var(--uc)}
.ch-num{grid-row:span 2;width:52px;height:52px;border-radius:16px;background:var(--uc);color:var(--on-color);display:grid;place-items:center;font:400 26px/1 var(--f-display);box-shadow:0 4px 0 var(--ucd)}
.ch-item.locked .ch-num{background:var(--lock);color:var(--lock-ink);box-shadow:0 4px 0 var(--lock-deep)}
.ch-item h4{font-size:20px}
.ch-item .meta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-soft)}
.ch-item .meta .pbar{flex:1;height:10px}
.ch-item .row{grid-column:1/-1;display:flex;gap:8px;margin-top:8px}
.ch-item .row .btn{flex:1}

/* ---------- Rail widgets ---------- */
.widget{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.widget h3{font-size:20px}
.w-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.streak-hero{display:flex;align-items:center;gap:14px}
.flame-big{width:64px;height:64px;color:var(--flame);flex:none}
.flame-big.off{color:var(--lock-ink)}
.streak-hero b{font:400 34px/1 var(--f-display);display:block;color:var(--flame);font-variant-numeric:tabular-nums}
.streak-hero.off b{color:var(--ink-faint)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.week span{font:700 11px/1 var(--f-body);color:var(--ink-faint);letter-spacing:.04em}
.week i{display:grid;place-items:center;margin:4px auto 0;width:28px;height:28px;border-radius:50%;background:var(--surface-2);color:var(--on-color)}
.week i .ic{width:16px;height:16px}
.week i.done{background:var(--flame)}
.week i.frozen{background:var(--ice)}
.week i.today{box-shadow:0 0 0 2px var(--flame)}
.freeze-row{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-soft)}
.freeze-row .ic{color:var(--ice);width:22px;height:22px}
.mini-board{display:flex;flex-direction:column;gap:6px}
.mb-row{display:grid;grid-template-columns:22px auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;font-size:14.5px}
.mb-row.me{background:var(--blue-soft)}
.mb-row .rank{font:400 16px/1 var(--f-display);color:var(--ink-soft);text-align:center}
.mb-row .avatar{width:32px;height:32px;font-size:15px}
.mb-row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb-row .xp{font-weight:600;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.rail-foot{font-size:12.5px;color:var(--ink-faint);text-align:center;padding:4px 10px;display:flex;flex-direction:column;gap:8px}

/* ---------- Legal ---------- */
.legal-nav{display:flex;flex-wrap:wrap;gap:8px}
.legal-nav .chip{border:0;cursor:pointer;font:600 14px/1 var(--f-body);color:var(--ink)}
.legal-nav .chip:hover{background:var(--surface-3)}
.legal-sec{display:flex;flex-direction:column;gap:12px;scroll-margin-top:calc(var(--top-h) + 16px)}
.legal-sec h2{font-size:24px}
.legal-sec h3{font:700 16px/1.3 var(--f-body);margin:6px 0 0}
.legal-sec p,.legal-sec li{font-size:15px;line-height:1.6;max-width:68ch}
.legal-sec ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.legal-sec a{color:var(--blue);font-weight:600}
.legal-sec dl{margin:0;display:flex;flex-direction:column}
.kv{display:grid;grid-template-columns:minmax(120px,32%) minmax(0,1fr);gap:12px;padding:10px 0;border-top:2px solid var(--line)}
.kv:first-child{border-top:0}
.kv dt{font-weight:700;font-size:14px;color:var(--ink-soft)}
.kv dd{margin:0;font-size:15px;overflow-wrap:anywhere}
.todo{display:inline-block;padding:1px 8px;border-radius:8px;border:2px dashed var(--flame);background:var(--flame-soft);color:var(--ink);font-size:13px;font-weight:700}
.table-wrap{overflow-x:auto}
.legal-sec table{border-collapse:collapse;width:100%;font-size:14px}
.legal-sec th,.legal-sec td{text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);vertical-align:top}
.legal-sec th{font:700 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.legal-links{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px}
.legal-links .link{font-size:12px;color:var(--ink-soft)}
@media (max-width:420px){.kv{grid-template-columns:1fr;gap:2px}}

/* ---------- Quests ---------- */
.quest{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px 14px;padding:12px 0}
.quest+.quest{border-top:2px solid var(--line)}
.q-icon{grid-row:span 2;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--qbg,var(--sun-soft));color:var(--qc,var(--sun-deep))}
.q-icon .ic{width:26px;height:26px}
.quest h4{font:700 15.5px/1.3 var(--f-body);margin:0}
.quest .pbar{height:16px}
.quest .pbar i{--pc:var(--sun)}
.q-chest{grid-row:span 2;appearance:none;border:0;background:none;padding:0;width:52px;height:52px;display:grid;place-items:center;cursor:default;color:var(--sun-deep)}
.q-chest .ic{width:42px;height:42px}
.q-chest.ready{cursor:pointer;animation:wiggle 1.6s ease-in-out infinite}
.q-chest.claimed{color:var(--ink-faint)}
/* Kincsesláda-nyitás: 4 koppintás, közben a láda jobbá válhat */
.chest-fx{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));background:#08130F;background:radial-gradient(circle at 50% 44%,color-mix(in srgb,var(--glow) 32%,#0B1A14) 0,#08130F 64%);color:#fff;text-align:center;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;cursor:pointer;animation:fadeIn .25s}
.chest-fx.open{cursor:default}
.cf-rays{position:absolute;left:50%;top:44%;width:150vmax;height:150vmax;translate:-50% -50%;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--glow) 55%,transparent) 0 9deg,transparent 9deg 24deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 40%);mask:radial-gradient(circle,#000 0,transparent 40%);opacity:calc(.14 + var(--charge,0) * .12);animation:cfSpin 28s linear infinite;pointer-events:none;transition:opacity .4s}
.chest-fx.open .cf-rays{opacity:.95;animation-duration:12s}
@keyframes cfSpin{to{rotate:360deg}}
.cf-head{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px}
.cf-tier{font:700 13px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;padding:8px 14px;border-radius:999px;background:var(--c2);color:#fff;box-shadow:0 3px 0 var(--c3);transition:background .3s}
.cf-title{font:400 30px/1.1 var(--f-display);margin:0;text-shadow:0 3px 0 rgba(0,0,0,.28)}
.cf-hint{margin:0;font-size:15px;opacity:.75}
.cf-stage{position:relative;width:min(290px,70vw);aspect-ratio:140/124}
.cf-chest{appearance:none;border:0;background:none;padding:0;width:100%;height:100%;cursor:pointer;filter:drop-shadow(0 0 calc(8px + var(--charge,0) * 8px) color-mix(in srgb,var(--glow) 75%,transparent));transition:filter .3s;animation:cfBob 2.2s ease-in-out infinite}
.cf-chest:focus-visible{outline:3px solid #fff;outline-offset:8px;border-radius:24px}
.cf-chest svg{display:block;width:100%;height:100%;overflow:visible}
.cf-lid,.cf-lock{transform-box:fill-box;transform-origin:50% 100%}
.chest-fx.open .cf-chest{animation:none;cursor:default}
@keyframes cfBob{50%{translate:0 -7px}}
.cf-dots{display:flex;gap:10px;position:relative}
.cf-dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.22);transition:background .2s,transform .2s,box-shadow .2s}
.cf-dots i.on{background:var(--glow);transform:scale(1.15);box-shadow:0 0 12px var(--glow)}
.cf-up{position:absolute;left:50%;top:34%;translate:-50% 0;z-index:2;white-space:nowrap;font:400 24px/1 var(--f-display);color:var(--c3);background:var(--c1);padding:10px 18px;border-radius:16px;box-shadow:0 5px 0 var(--c3);pointer-events:none;animation:comboPop 1.5s cubic-bezier(.2,1.4,.4,1) forwards}
.cf-flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 44%,#fff 0,color-mix(in srgb,var(--glow) 60%,transparent) 28%,transparent 62%);animation:cfFlash .65s ease-out forwards}
@keyframes cfFlash{from{opacity:1}to{opacity:0}}
.cf-foot{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:340px;min-height:150px}
.chest-fx.open .cf-hint{visibility:hidden}
.cf-reward{display:flex;flex-direction:column;align-items:center;gap:10px;animation:zoomIn .4s cubic-bezier(.2,1.3,.4,1)}
.cf-gems{display:flex;align-items:center;gap:10px;font:400 46px/1 var(--f-display);text-shadow:0 3px 0 rgba(0,0,0,.3)}
.cf-gems .ic{width:46px;height:46px;color:#A68CFF;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.cf-perk{display:flex;align-items:center;gap:8px;font-weight:700;color:#FFE08A}
.cf-perk .ic{width:20px;height:20px}
.cf-done{width:100%}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.month-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;background:linear-gradient(135deg,var(--gem),var(--blue));color:var(--on-color);border-radius:22px;padding:18px;box-shadow:0 5px 0 var(--gem-deep)}
.month-badge{width:76px;height:84px;color:var(--sun)}
.month-card h3{font-size:22px}
.month-card .pbar{background:rgba(0,0,0,.2);margin-top:10px;height:16px}
.month-card .pbar-label{color:var(--on-color)}
.timer-note{display:flex;align-items:center;gap:6px;font:700 13px/1 var(--f-body);color:var(--sun-deep);letter-spacing:.04em}
.timer-note .ic{width:18px;height:18px}

/* ---------- League ---------- */
.leagues{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.lg-badge{width:36px;height:40px;color:var(--lc);opacity:.95;flex:none}
.lg-badge.locked{color:var(--surface-3)}
.lg-badge.cur{width:70px;height:78px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
.leagues{align-items:center;flex-wrap:nowrap;gap:4px}
.league-head{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.league-head h1{font-size:32px}
.board{display:flex;flex-direction:column}
.b-row{display:grid;grid-template-columns:34px auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;appearance:none;border:0;background:none;text-align:left;width:100%;cursor:pointer;color:inherit}
.b-row:hover{background:var(--surface-2)}
.b-row.me{background:var(--blue-soft)}
.b-row .rank{font:400 20px/1 var(--f-display);text-align:center;color:var(--ink-soft)}
.b-row .rank.r1{color:var(--sun-deep)}.b-row .rank.r2{color:var(--ink-faint)}.b-row .rank.r3{color:var(--flame-deep)}
.b-row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-row .nm small{display:block;font-weight:400;font-size:12.5px;color:var(--ink-soft)}
.b-row .xp{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.zone{display:flex;align-items:center;gap:8px;justify-content:center;padding:8px;font:700 12px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase}
.zone.up{color:var(--good-btn)}
.zone.down{color:var(--bad-btn)}
.zone .ic{width:16px;height:16px}
.zone::before,.zone::after{content:"";flex:1;border-top:2px dashed currentColor;opacity:.5}

/* ---------- Shop ---------- */
.shop-sec{display:flex;flex-direction:column;gap:10px}
.shop-sec h2{font-size:24px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px;border:2px solid var(--line);border-radius:20px;background:var(--surface)}
.item-art{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--ia-bg,var(--surface-2));color:var(--ia,var(--brand))}
.item-art .ic{width:34px;height:34px}
.item-art .tekla{width:60px;height:60px}
.item h4{font:700 16.5px/1.3 var(--f-body);margin:0}
.item p{font-size:13.5px;color:var(--ink-soft);margin-top:2px}
.price{display:inline-flex;align-items:center;gap:4px}
.price .ic{width:18px;height:18px}
.equipped{display:flex;gap:4px;margin-top:6px}
.equipped i{width:20px;height:20px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;color:var(--ice)}
.equipped i.on{background:var(--ice-soft)}
.equipped i .ic{width:14px;height:14px}
@media (max-width:420px){.item{grid-template-columns:auto minmax(0,1fr)}.item>.btn,.item>.pill{grid-column:1/-1}}

/* ---------- Profile ---------- */
.prof-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.prof-head h1{font-size:30px;overflow-wrap:anywhere}
.prof-head .muted{font-size:14px}
.follow-counts{display:flex;gap:16px;font-size:14px;margin-top:6px}
.follow-counts b{font-family:var(--f-display);font-weight:400;font-size:17px}
.code-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2);border-radius:14px;padding:10px 12px;font-size:14px}
.code-box code{font:600 18px/1 var(--f-mono);letter-spacing:.14em;background:none;padding:0;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat-tile{display:flex;align-items:center;gap:12px;padding:14px;border:2px solid var(--line);border-radius:18px;background:var(--surface)}
.stat-tile .ic{width:30px;height:30px;color:var(--sc)}
.stat-tile b{display:block;font:400 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat-tile span{font-size:13px;color:var(--ink-soft)}
.chart{width:100%;max-width:460px;height:auto;display:block;margin:0 auto}
.chart text{fill:var(--ink-soft);font:600 11px var(--f-body)}
.chart .val{fill:var(--ink);font:400 13px var(--f-display)}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ach{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 10px;border:2px solid var(--line);border-radius:18px;background:var(--surface)}
.ach-medal{position:relative;width:64px;height:70px;color:var(--ac)}
.ach-medal .shield{width:64px;height:70px}
.ach-medal .ic.inner{position:absolute;left:50%;top:46%;translate:-50% -50%;width:28px;height:28px;color:var(--on-color)}
.ach.locked .ach-medal{color:var(--surface-3)}
.ach.locked .ach-medal .ic.inner{color:var(--ink-faint)}
.ach-lvl{position:absolute;left:50%;bottom:-4px;translate:-50% 0;background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:2px 8px;font:700 10.5px/1.2 var(--f-body);white-space:nowrap;color:var(--ink-soft)}
.ach h4{font:700 14.5px/1.2 var(--f-body);margin:4px 0 0}
.ach p{font-size:12.5px;color:var(--ink-soft);line-height:1.35}
.ach .pbar{width:100%;height:9px}
.ach .pbar i{--pc:var(--ac)}
.friend-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 4px}
.friend-row+.friend-row{border-top:2px solid var(--line)}
.friend-row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.friend-row .sub{font-size:13px;color:var(--ink-soft);display:flex;gap:10px;flex-wrap:wrap}
.friend-row .sub span{display:inline-flex;align-items:center;gap:3px}
.friend-row .sub .ic{width:14px;height:14px}
.offline-note{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;background:var(--blue-soft);border-radius:16px;padding:14px;font-size:14px;color:var(--ink)}
.offline-note .ic{color:var(--blue);width:22px;height:22px}
.search{width:100%;font:500 16px/1.3 var(--f-body);padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.search:focus{outline:none;border-color:var(--blue)}
.code-in{font:600 22px/1.2 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;text-align:center}
.row .search{flex:1 1 180px;min-width:0;width:auto}
.row>.btn.blue,.row>.btn.ghost.sm{flex:0 0 auto}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{appearance:none;flex:1 1 90px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:14px;padding:10px 8px;cursor:pointer;font:600 14px/1.2 var(--f-body);color:var(--ink)}
.seg button small{display:block;font-weight:400;color:var(--ink-soft);font-size:12px;margin-top:2px}
.seg button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:2px solid var(--line)}
.set-row:first-of-type{border-top:0}
.switch{appearance:none;width:52px;height:30px;border-radius:99px;background:var(--surface-3);position:relative;cursor:pointer;border:0;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 2px 4px var(--shadow);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--brand)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}

/* ---------- Practice ---------- */
.pr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.pr-card{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:22px;border:2px solid var(--line);background:var(--surface)}
.pr-card .art{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--pbg);color:var(--pc)}
.pr-card .art .ic{width:32px;height:32px}
.pr-card h3{font-size:22px}
.pr-card p{font-size:14px;color:var(--ink-soft);flex:1}
.pr-card .btn{margin-top:4px}
.guide-list{display:flex;flex-direction:column;gap:8px}
.guide-item{appearance:none;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.guide-item:hover{background:var(--surface-2)}
.guide-item .sw{width:34px;height:34px;border-radius:11px;background:var(--uc);color:var(--on-color);display:grid;place-items:center;flex:none}
.guide-item .sw .ic{width:20px;height:20px}
.guide-item b{font-weight:600;display:block}
.guide-item small{color:var(--ink-soft);font-size:13px}

/* ---------- Sheets ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fadeIn .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:26px 26px 0 0;padding:22px 16px calc(22px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;box-shadow:0 -10px 34px var(--shadow);animation:rise2 .28s cubic-bezier(.2,.9,.3,1.15)}
@media (min-width:700px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(560px,calc(100vw - 32px));translate:-50% -50%;border-radius:26px;max-height:86vh;animation:zoomIn .26s cubic-bezier(.2,1.2,.4,1)}}
@keyframes rise2{from{transform:translateY(60px);opacity:0}}
@keyframes zoomIn{from{transform:scale(.9);opacity:0}}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet h3{font-size:28px}
.sheet .eyebrow{color:var(--uc,var(--brand))}
.sheet .meta{color:var(--ink-soft);font-size:15px}
.sheet-x{position:absolute;right:12px;top:12px}
.learn{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:500}
.chip .ic{width:16px;height:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 180px}
.note{font-size:14px;color:var(--ink-soft)}
.center{align-items:center;text-align:center}
.guide-tip{border-top:2px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.guide-tip h4{font-size:21px}
.cal{display:flex;flex-direction:column;gap:8px}
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-head b{font:400 20px/1 var(--f-display)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal-grid span{font:700 11px/1 var(--f-body);color:var(--ink-faint);padding:4px 0}
.cal-grid i{aspect-ratio:1;max-width:100%;display:grid;place-items:center;border-radius:50%;font:600 13px/1 var(--f-body);font-style:normal;color:var(--ink-soft)}
.cal-grid i.done{background:var(--flame);color:var(--on-color)}
.cal-grid i.frozen{background:var(--ice);color:var(--on-color)}
.cal-grid i.today{box-shadow:inset 0 0 0 2px var(--flame);color:var(--flame);font-weight:700}
.cal-grid i.done.today{color:var(--on-color)}
.cal-legend{display:flex;gap:14px;justify-content:center;font-size:12.5px;color:var(--ink-soft)}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.milestone{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--flame-soft)}
.milestone .ic{color:var(--flame);width:28px;height:28px}
.milestone b{font-family:var(--f-display);font-weight:400;font-size:17px;display:block}
.big-hearts{display:flex;gap:6px;justify-content:center;color:var(--heart)}
.big-hearts .ic{width:40px;height:40px}
.big-hearts .off{color:var(--surface-3)}

/* ---------- Lesson ---------- */
.lesson{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lesson:not([hidden]){animation:lessonIn .38s cubic-bezier(.2,.9,.3,1)}
@keyframes lessonIn{from{opacity:0;transform:translateY(28px)}}
.lesson::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 80px 4px var(--bad-btn);z-index:5}
.lesson.flash::after{animation:flash .6s ease-out}
@keyframes flash{15%{opacity:.6}}
.l-top{max-width:680px;width:100%;margin:0 auto;display:flex;align-items:center;gap:12px;padding:14px 16px 6px}
.bar{flex:1;height:18px;background:var(--surface-3);border-radius:99px;overflow:hidden;position:relative}
.bar-fill{height:100%;width:0;background:var(--good-btn);border-radius:99px;transition:width .5s cubic-bezier(.3,1.4,.5,1);position:relative;overflow:hidden}
.bar-fill::after{content:"";position:absolute;left:10px;right:10px;top:4px;height:4px;border-radius:99px;background:var(--sheen)}
.bar-fill::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.65) 50%,transparent 65%);transform:translateX(-100%)}
.bar-fill.glint::before{animation:glint .8s ease-out}
@keyframes glint{to{transform:translateX(100%)}}
.bar.hot .bar-fill{background:linear-gradient(90deg,var(--sun),var(--flame))}
.bar.timer .bar-fill{transition:width .25s linear;background:var(--blue)}
.bar.timer.low .bar-fill{background:var(--bad-btn)}
.hearts{display:flex;align-items:center;gap:4px;color:var(--heart);font:400 20px/1 var(--f-display);font-variant-numeric:tabular-nums;min-width:44px}
.hearts.lives{color:var(--legend-ink)}
.hearts.timer{color:var(--blue)}
.hearts.hit{animation:heartHit .55s}
@keyframes heartHit{15%{transform:scale(1.35) rotate(-10deg)}30%{transform:scale(1.1) translateX(-5px)}50%{transform:translateX(5px)}70%{transform:translateX(-3px)}85%{transform:translateX(2px)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.combo{height:22px;max-width:680px;width:100%;margin:0 auto;padding:0 72px;font:700 13px/22px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--flame);display:flex;align-items:center;gap:10px}
.combo-in{display:inline-flex;align-items:center;gap:4px;transform-origin:left center}
.combo-in.bump{animation:bump .5s cubic-bezier(.2,1.6,.4,1)}
.combo .ic{width:16px;height:16px}
.combo .mode{color:var(--uc,var(--brand))}
.combo .boost{color:var(--sun-deep)}
.combo:empty{visibility:hidden}
.l-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 16px 32px}
.l-inner{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px;animation:slide .34s cubic-bezier(.2,.9,.3,1)}
.l-inner.leaving{animation:leave .17s ease-in forwards}
@keyframes slide{from{opacity:0;transform:translateX(44px)}}
@keyframes leave{to{opacity:0;transform:translateX(-44px)}}
.kicker{display:flex;align-items:center;gap:8px;font:700 13px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--uc,var(--brand))}
.kicker.retry{color:var(--flame)}
.kicker .ic{width:18px;height:18px}
.q{font-family:var(--f-display);font-size:clamp(24px,5.6vw,31px)}
.code{margin:0;background:var(--code-bg);color:var(--code-ink);border-radius:16px;padding:14px 16px;font:500 15.5px/1.65 var(--f-mono);white-space:pre;tab-size:4;overflow-x:auto}
.code code{background:none;padding:0;font:inherit}
.c-kw{color:var(--code-kw);font-weight:600}.c-str{color:var(--code-str)}.c-num{color:var(--code-num)}.c-fn{color:var(--code-fn)}.c-com{color:var(--code-com);font-style:italic}
.out{display:flex;flex-direction:column;gap:6px}
.out-label{font:700 12px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.out-label .chip{font:500 13px/1.2 var(--f-body);letter-spacing:0;text-transform:none;padding:4px 10px}
.out pre{margin:0;background:var(--surface);border:2px dashed var(--line);border-radius:14px;padding:12px 16px;font:500 15.5px/1.6 var(--f-mono);white-space:pre;tab-size:4;overflow-x:auto;color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px 14px;font:500 16.5px/1.4 var(--f-body);color:var(--ink);cursor:pointer;transition:background .12s,border-color .12s,transform .06s}
.opt:hover:not(:disabled){background:var(--surface-2)}
.opt:active:not(:disabled){transform:translateY(2px)}
.opt>span:last-child,.opt>pre{min-width:0}
.opt-key{flex:none;width:28px;height:28px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font:600 13px/1 var(--f-mono);color:var(--ink-soft)}
.opt-pre{margin:0;font:500 16px/1.5 var(--f-mono);white-space:pre;tab-size:4;overflow-x:auto}
.opt-err{font-style:italic;color:var(--ink-soft)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft);animation:selPop .22s ease-out}
.opt.sel .opt-key{border-color:var(--blue);color:var(--blue)}
.opt.right{border-color:var(--good-btn);background:var(--good-bg);color:var(--good-ink);animation:okPop .5s cubic-bezier(.2,1.6,.4,1)}
.opt.right .opt-key{border-color:var(--good-btn);color:var(--good-ink)}
.opt.wrong{border-color:var(--bad-btn);background:var(--bad-bg);color:var(--bad-ink);animation:shake .45s}
.opt.wrong .opt-key{border-color:var(--bad-btn);color:var(--bad-ink)}
.opt:disabled{cursor:default}
@keyframes selPop{40%{transform:scale(.97)}}
@keyframes okPop{35%{transform:scale(1.05)}65%{transform:scale(.99)}}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{appearance:none;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:13px;padding:10px 14px;font:600 16px/1.2 var(--f-mono);color:var(--ink);cursor:pointer;white-space:pre;transition:transform .06s,background .12s}
.tile:hover:not(:disabled){background:var(--surface-2)}
.tile:active:not(:disabled){transform:translateY(2px)}
.tile.used{background:var(--surface-2);border-color:var(--surface-2);color:transparent;cursor:default}
.tile.sel{border-color:var(--blue);background:var(--blue-soft);animation:selPop .22s ease-out}
.tile.bad{border-color:var(--bad-btn);background:var(--bad-bg);animation:shake .4s}
.tile.matched{border-color:var(--good-btn);background:var(--good-bg);color:var(--good-ink);opacity:.55;cursor:default;animation:matchPop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes matchPop{0%{opacity:1}35%{transform:scale(1.08);opacity:1}70%{opacity:1}}
.answer-line{min-height:66px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:10px 0;border-top:2px solid var(--line);border-bottom:2px solid var(--line);transition:border-color .2s}
.answer-line.right{border-color:var(--good-btn)}
.answer-line.wrong{border-color:var(--bad-btn);animation:shake .45s}
.answer-line.right .tile{border-color:var(--good-btn);background:var(--good-bg);color:var(--good-ink);animation:okPop .5s calc(var(--i,0) * 55ms) cubic-bezier(.2,1.6,.4,1)}
.answer-line.wrong .tile{border-color:var(--bad-btn);background:var(--bad-bg);color:var(--bad-ink)}
.slot{display:inline-block;min-width:3.4em;padding:0 6px;border-radius:6px;border-bottom:2px dashed var(--code-num);background:var(--slot-bg);color:var(--code-num);cursor:pointer;text-align:center}
.slot.filled{border-bottom-style:solid;color:var(--code-ink)}
.slot.right{border-bottom-color:var(--good-btn);background:var(--good-btn);color:var(--on-color);animation:okPop .5s cubic-bezier(.2,1.6,.4,1)}
.slot.wrong{border-bottom-color:var(--bad-btn);background:var(--bad-btn);color:var(--on-color);animation:shake .45s}
.chips-row{display:flex;flex-wrap:wrap;gap:10px}
.buglist{display:flex;flex-direction:column;gap:6px;background:var(--code-bg);border-radius:16px;padding:10px;overflow-x:auto}
.bugline{appearance:none;display:flex;gap:14px;width:100%;min-width:max-content;text-align:left;background:transparent;color:var(--code-ink);border:2px solid transparent;border-radius:10px;padding:7px 10px;font:500 15.5px/1.5 var(--f-mono);cursor:pointer;white-space:pre}
.bugline:hover:not(:disabled){border-color:var(--code-com)}
.bugline .ln{color:var(--code-com);min-width:1.2em;text-align:right}
.bugline code{background:none;padding:0;font:inherit;border-radius:0}
.bugline.sel{border-color:var(--blue)}
.bugline.right{border-color:var(--good-btn);background:var(--slot-bg);animation:okPop .5s cubic-bezier(.2,1.6,.4,1)}
.bugline.wrong{border-color:var(--bad-btn);animation:shake .45s}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match>div{display:flex;flex-direction:column;gap:10px;min-width:0}
.match .tile{width:100%;white-space:normal;min-height:56px}
.match .r .tile{font-family:var(--f-body);font-weight:500;font-size:15px}
.type-in{width:100%;font:600 20px/1.3 var(--f-mono);padding:14px 16px;border-radius:16px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);color:var(--ink)}
.type-in:focus{outline:none;border-color:var(--blue)}
.type-in.right{border-color:var(--good-btn);background:var(--good-bg);animation:okPop .5s cubic-bezier(.2,1.6,.4,1)}
.type-in.wrong{border-color:var(--bad-btn);background:var(--bad-bg);animation:shake .45s}
.tip-head{display:flex;align-items:flex-end;gap:12px}
.tip-head .tekla{width:88px;height:88px;flex:none;animation:dropIn .65s cubic-bezier(.2,1.5,.4,1) backwards}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;font-size:15px;min-width:0}
.bubble::before{content:"";position:absolute;left:-10px;bottom:18px;border:9px solid transparent;border-right-color:var(--line);border-left:0}
.bubble strong{font-family:var(--f-display);font-weight:400;font-size:22px;display:block;line-height:1.15}
.tip-head .bubble{margin-bottom:14px;transform-origin:left bottom;animation:bubbleIn .45s .2s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes bubbleIn{from{opacity:0;transform:scale(.5)}}
.tip-body{display:flex;flex-direction:column;gap:8px;font-size:17px}
.l-foot{position:relative;overflow:hidden;border-top:2px solid var(--line);background:var(--bg);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.l-foot::before{content:"";position:absolute;inset:0;background:var(--good-bg);transform:translateY(101%)}
.l-foot.good,.l-foot.bad{border-color:transparent}
.l-foot.bad::before{background:var(--bad-bg)}
.l-foot.good::before,.l-foot.bad::before{transform:none;transition:transform .3s cubic-bezier(.2,1.15,.35,1)}
.foot-in{position:relative;max-width:620px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.fb{flex:1 1 300px;display:flex;gap:14px;align-items:flex-start;min-width:0}
.fb-icon{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--surface);animation:pop .5s .1s cubic-bezier(.2,1.6,.4,1) backwards}
.fb-icon .ic{width:30px;height:30px}
.good .fb-icon{color:var(--good-btn)}
.bad .fb-icon{color:var(--bad-btn)}
.fb-text{min-width:0;display:flex;flex-direction:column;gap:4px;animation:rise .35s .12s cubic-bezier(.2,1,.3,1) backwards}
.fb-title{font:400 25px/1.1 var(--f-display)}
.good .fb-text{color:var(--good-ink)}
.bad .fb-text{color:var(--bad-ink)}
.fb-ans{font-weight:600}
.fb-ans code{background:var(--surface);white-space:pre-wrap}
.fb-why{font-size:15px;line-height:1.45}
.foot-btns{display:flex;gap:10px;flex:1 1 200px;justify-content:flex-end}
.foot-btns .btn{flex:1 1 auto;max-width:100%}
.foot-in.solo .foot-btns{flex-basis:100%}
.l-foot.good .btn,.l-foot.bad .btn{animation:pop .4s .08s cubic-bezier(.2,1.6,.4,1) backwards}
@media (min-width:640px){.foot-btns .btn{flex:0 0 auto;min-width:180px}.foot-in.solo .foot-btns{flex-basis:auto;margin-left:auto}}
@keyframes pop{from{transform:scale(.3)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes dropIn{from{opacity:0;transform:translateY(-36px) scale(.6)}}

/* result & post screens */
.result{align-items:center;text-align:center;gap:16px;padding-top:8px}
.result .tekla{width:150px;height:150px}
.result h2{font-size:clamp(32px,8vw,42px);color:var(--sun-deep)}
.result.fail h2{color:var(--bad-ink)}
.result>.tekla{animation:dropIn .7s cubic-bezier(.2,1.5,.4,1) backwards}
.result>h2{animation:rise .45s .2s cubic-bezier(.2,1.2,.4,1) backwards}
.result>.note{animation:rise .45s .35s cubic-bezier(.2,1.2,.4,1) backwards}
.big-stars{display:flex;gap:8px;color:var(--sun)}
.big-stars .ic{width:48px;height:48px;animation:starIn .6s .45s cubic-bezier(.2,1.6,.4,1) backwards}
.big-stars .ic:nth-child(2){animation-delay:.75s}
.big-stars .ic:nth-child(3){animation-delay:1.05s}
.big-stars .ic.off{color:var(--surface-3);animation:fadeIn .4s .45s backwards}
@keyframes starIn{0%{transform:scale(0) rotate(-150deg)}65%{transform:scale(1.3) rotate(12deg)}100%{transform:none}}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:460px}
.st{border:2px solid var(--tc);border-radius:16px;overflow:hidden;background:var(--tc);animation:rise .45s 1.3s cubic-bezier(.2,1.3,.4,1) backwards}
.st:nth-child(2){animation-delay:1.4s}.st:nth-child(3){animation-delay:1.5s}
.st>span{display:block;color:var(--on-color);font:700 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;padding:8px 4px 6px}
.st b{display:flex;align-items:center;justify-content:center;gap:4px;background:var(--surface);color:var(--tc);font:400 23px/1 var(--f-display);padding:12px 4px;border-radius:13px 13px 0 0;font-variant-numeric:tabular-nums}
.st b .ic{width:20px;height:20px}
.perks{display:flex;flex-direction:column;gap:8px;align-items:center}
.perk{display:flex;align-items:center;gap:8px;font-weight:600;animation:rise .45s 1.75s cubic-bezier(.2,1.3,.4,1) backwards}
.perk:nth-child(2){animation-delay:1.9s}.perk:nth-child(3){animation-delay:2.05s}.perk:nth-child(4){animation-delay:2.2s}
.perk .ic{width:20px;height:20px}
.streak-screen{align-items:center;text-align:center;gap:14px;padding-top:12px}
.streak-flame{position:relative;width:170px;height:170px;color:var(--flame);animation:dropIn .7s cubic-bezier(.2,1.5,.4,1) backwards}
.streak-flame .ic{width:170px;height:170px}
.streak-num{font:400 84px/1 var(--f-display);color:var(--flame);font-variant-numeric:tabular-nums;animation:rise .5s .3s cubic-bezier(.2,1.3,.4,1) backwards}
.streak-screen h2{font-size:30px;animation:rise .5s .4s backwards}
.streak-screen .week{width:100%;max-width:380px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;animation:rise .5s .55s backwards}
.streak-screen .week i{width:34px;height:34px}
.post-list{display:flex;flex-direction:column;gap:12px;width:100%;max-width:460px;text-align:left}
.post-list .quest{border:2px solid var(--line);border-radius:18px;padding:12px 14px;background:var(--surface);animation:rise .45s backwards}
.post-list .quest+.quest{border-top-width:2px}
.ach-unlock{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;border:2px solid var(--line);border-radius:18px;padding:14px;background:var(--surface);animation:rise .45s backwards}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}
.combo-pop{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:61;pointer-events:none;display:flex;align-items:center;gap:8px;white-space:nowrap;background:var(--flame);color:var(--on-color);font:400 24px/1 var(--f-display);letter-spacing:.02em;padding:12px 20px;border-radius:18px;box-shadow:0 5px 0 var(--flame-deep);translate:-50% 0;animation:comboPop 1.5s cubic-bezier(.2,1.4,.4,1) forwards}
.combo-pop .ic{width:28px;height:28px;color:var(--on-color)}
@keyframes comboPop{0%{opacity:0;transform:scale(.3) rotate(-10deg)}16%{opacity:1;transform:scale(1.12) rotate(3deg)}28%{transform:none}78%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-26px) scale(.92)}}
.bump{animation:bump .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{30%{transform:scale(1.35)}}

/* Tekla */
.tekla{display:block;overflow:visible}
.tekla .m-happy,.tekla .m-sad{display:none}
.tekla.happy .m-idle,.tekla.sad .m-idle{display:none}
.tekla.happy .m-happy{display:inline}
.tekla.sad .m-sad{display:inline}
.tekla .t-all{transform-origin:60px 110px;animation:sway 3.2s ease-in-out infinite}
.tekla.happy .t-all{animation:hop .7s cubic-bezier(.3,1.6,.5,1) 2}
.tekla.sad .t-all{animation:none;transform:rotate(-4deg) translateY(3px)}
.tekla .t-eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.tekla.still .t-all{animation:none}
.poke{cursor:pointer}
.tekla.boing .t-all{animation:boing .7s cubic-bezier(.2,1.6,.4,1)}
.tekla.boing .m-idle,.tekla.boing .m-sad{display:none}
.tekla.boing .m-happy{display:inline}
@keyframes sway{50%{transform:rotate(2deg) translateY(-1px)}}
@keyframes hop{40%{transform:translateY(-12px) scale(1.03)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes boing{25%{transform:translateY(-14px) scale(.94,1.08)}50%{transform:translateY(0) scale(1.08,.92)}75%{transform:scale(.98,1.02)}}

@media (max-width:420px){
  .course b{display:none}
  .chip-btn{padding:8px 6px;font-size:18px;gap:4px}
  .chip-btn .ic{width:22px;height:22px}
  .combo{padding:0 16px}
  .tiles3 .st b{font-size:19px}
  .unit-head h3{font-size:21px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

r ki?","code":"lista = [\"a\", \"b\", \"c\", \"d\"]\nprint(len(lista))","opts":["4","3","5","d"],"a":0,"why":"A listának négy eleme van.","run":true,"inp":[],"mono":true,"namecheck":null,"evaltype":false},{"t":"type","q":"Mit ír ki?","code":"szamok = [4, 7, 1]\nszamok[0] = 9\nprint(szamok)","a":["[9, 7, 1]","[9,7,1]"],"why":"Az első elem helyére 9 kerül.","run":true,"inp":[],"evaltype":null,"ph":"pl. [1, 2, 3]"},{"t":"choice","q":"Mit ír ki?","code":"l = [1, 2]\nl.append(5)\nprint(l)","opts":["[1, 2, 5]","[5, 1, 2]","[1, 2, [5]]","[1, 7]"],"a":0,"why":"Az append() a lista végére teszi az új elemet.","run":true,"inp":[],"mono":true,"namecheck":null,"evaltype":false},{"t":"choice","q":"Mit ír ki?","code":"l = [5, 6, 7]\nprint(l[3])","opts":[{"err":"Hibát ad (IndexError)"},"7","None","[]"],"a":0,"why":"Három elem van, az indexek 0, 1, 2. A 3-as index nem létezik.","run":true,"inp":[],"mono":true,"namecheck":null,"evaltype":false},{"t":"choice","q":"Mit ír ki?","code":"nevek = [\"Anna\", \"Bence\", \"Csaba\"]\nprint(nevek[-1][0])","opts":["C","Csaba","A","a"],"a":0,"why":"A nevek[-1] a Csaba, annak a 0-s indexű karaktere a C.","run":true,"inp":[],"mono":true,"namecheck":null,"evaltype":false},{"t":"fill","q":"Egészítsd ki, hogy ezt írja ki: [1, 2, 3]","code":"l = [1, 2]\nl.___(3)\nprint(l)","opts":["append","add","insert"],"a":0,"out":"[1, 2, 3]","why":"Listához az append() ad új elemet a végére. Az add() listán nem létezik, az insert() pedig két értéket vár.","inp":[]},{"t":"build","q":"Rakd össze: hozz létre egy listát a 3, 6, 9 számokkal!","tiles":["l","=","[","3,","6,","9","]"],"extra":["(",")"],"check":"l = [3, 6, 9]","why":"A lista elemeit szögletes zárójelbe tesszük, vesszővel elválasztva.","out":null},{"t":"match","q":"Párosítsd! (l = [8, 3, 5])","pairs":[["l[0]","8"],["l[-1]","5"],["len(l)","3"],["l[1] * 2","6"]],"kind":null,"why":"","mctx":"l = [8, 3, 5]"}]},{"id":"l24","unit":"u10","title":"Listaműveletek","icon":"sort","tips":[{"title":"Hozzáadás és törlés", les":["for","elem","in","lista",":"],"extra":["range(lista)","len"],"check":"lista = [1, 2]\nfor elem in lista:\n    pass","why":"A for közvetlenül a lista elemein is végig tud menni.","out":null}]},{"id":"l26","unit":"u10","title":"Fejezetzáró vizsga","icon":"trophy","exam":true,"scope":"c3","count":12,"tips":[{"title":"Fejezetzáró vizsga","body":"Most a Szövegek és listák fejezet minden témájából kapsz kérdést: 12 feladat. Ha hibázol, a kérdés a végén visszajön. Sok sikert!","code":null,"inp":[],"note":null,"out":null}],"ex":[]},{"id":"l27","unit":"u11","title":"def és paraméterek","icon":"func","tips":[{"title":"Saját függvény","body":"A **def** kulcsszóval saját függvényt hozhatsz létre. A függvény törzse csak akkor fut le, amikor meghívod a nevével és zárójellel.","code":"def koszon():\n    print(\"Szia!\")\n\nkoszon()\nkoszon()","inp":[],"note":null,"out":"Szia!\nSzia!"},{"title":"Paraméterek","body":"A zárójelbe írt paraméterek a függvény bemenetei. Híváskor az átadott értékek kerülnek beléjük, a megadott sorrendben.","code":"def udvozol(nev, kor):\n    print(nev, \"most\", kor, \"éves\")\n\nudvozol(\"Kata\", 16)","inp":[],"note":null,"out":"Kata most 16 éves"}],"ex":[{"t":"choice","q":"Mit ír ki?","code":"def hello():\n    print(\"Hello\")\n\nprint(\"Start\")","opts":["Start","Hello\nStart","Start\nHello",{"err":"Hibát ad"}],"a":0,"why":"A függvény csak létre van hozva, de senki nem hívja meg, ezért a törzse nem fut le.","run":true,"inp":[],"mono":true,"namecheck":null,"evaltype":false},{"t":"choice","q":"Mit ír ki?","code":"def ketszer(x):\n    print(x * 2)\n\nketszer(4)\nketszer(\"ab\")","opts":["8\nabab","8\nab2",{"err":"Hibát ad"},"44\nabab"],"a":0,"why":"A paraméter bármilyen érték lehet: a szám kétszerese 8, a szöveg kétszer ismételve abab.","run":true,"inp":[],"mono":true,"namecheck":null,"evaltype":false},{"t":"type","q":"Mit ír ki?","code":"def osszeg(a, b):\n    print(a + b)\n\nosszeg(3, 9)","a":["12"],"why":"A 3 az a-ba, a 9 a b-be kerül, a függvény kiírja az összegüket.","run":true,"inp":[],"evaltype":null,"ph":"Írd be a választ"},{"t":"choice","q":"Mit ír ki?","code":"def kivon(a, b):\n    print(a - b)\n\nkivon(2, 10)","opts":["-8","8","210",{"err":"Hibát ad"}],"a":0,"why":"A sorrend számít: a értéke 2, b értéke 10, így 2 - 10 = -8.","run":true,"inp":[],"mono":true,"namecheck":null,"evaltype":false},{"t":"choice","q":"Mit ír ki?","code":"def f(x):\n    print(x)\n\nf()","opts":[{"err":"Hibát ad (TypeError)"},"None","x","Semmit"],"a":0,"why":"A függvénynek egy paramétere van, de híváskor nem adtunk át értéket.","run":true,"inp":[],"mono":true,"namecheck":null,"evaltype":false},{"t":"bug","q":"Melyik sorban van a hiba?","lines":["def szia(nev)","    print(\"Szia\", nev)","szia(\"Bálint\")"],"a":0,"why":"A def sor végéről hiányzik a kettőspont.","inp":[],"err":"SyntaxError","norun":false},{"t":"build","q":"Rakd össze a függvény első sorát: neve dupla, paramétere x!","tiles":["def","dupla","(x)",":"],"extra":["dupla()","return"],"check":"def dupla(x):\n    pass","why":"Előbb a def, aztán a név, zárójelben a paraméter, a végén kettőspont.","out":null},{"t":"fill","q":"Egészítsd ki, hogy háromszor írja ki: Hurrá!","code":"def ujjong(n):\n    for i in range(n):\n        print(\"Hurrá!\")\n\nujjong(___)","opts":["3","2","\"3\""],"a":0,"out":"Hurrá!\nHurrá!\nHurrá!","why":"Az n értéke 3 lesz, így a ciklus háromszor fut le. A \"3\" szöveg lenne, azzal a range() hibát ad.","inp":[]},{"t":"match","q":"Párosítsd a fogalmat a jelentésével!","pairs":[["def","függvény létrehozása"],["paraméter","a függvény bemenete"],["hívás","a függvény futtatása"],["törzs","a behúzott utasítások"]],"kind":null,"why":"","mctx":null}]},{"id":"l28","unit":"u11","title":"Visszatérési érték","icon":"ret","tips":[{"title":"return","body":"A **return** visszaadja az eredményt a hívónak, és azonnal befejezi a függvényt. A visszaadott értéket eltárolhatod, vagy tovább számolhatsz vele.","code":"def negyzet(x):\n    return x * x\n\ny = negyzet(5) + 1\nprint(y)","inp":[],"note":null,"out":"26"},{"title":"print vagy return?","body":"A `print()` csak kiírja az értéket, a `return` visszaadja. Ha egy függvényben nincs return, az eredménye `None`.","code":"def kiir(x):\n    print(x)\n\neredmeny = kiir(3)\nprint(eredmeny)","inp":[],"note":null,"out":"3\nNone"}],"ex":[{"t":"choice","q":"Mit ír ki?","code":"def tripla(x):\n    return x * 3\n\nprint(tripla(4) + 1)","opts":["13","12","15",{"err":"Hibát ad"}],"a":0,"why":"A tripla(4) visszaadja a 12-t, ehhez adunk 1-et.","run":true,"inp":[],"mono":true,"namecheck":null,"evaltype":false},{"t":"choice","q":"Mit ír ki?","code":"def f(x):\n    print(x * 2)\n\ny = f(5)\nprint(y)","opts":["10\nNone","10\n10","None","10"],"a":0,"why":"Az f kiírja a 10-et, de nincs benne return, ezért y értéke None lesz.","run":true,"inp":[],"mono":true,"namecheck":null,"evaltype":false},{"t":"type","q":"Mit ír ki?","code":"def nagyobb(a, b):\n    if a > b:\n        return a\n    return b\n\nprint(nagyobb(7, 11))","a":["11"],"why":"A 7 > 11 hamis, ezért az első return kimarad, és a függvény b-t, vagyis 11-et ad vissza.","run":true,"inp":[],"evaltype":null,"ph":"Írd be a választ"},{"t":"choice","q":"Mit ír ki?","code":"def f():\n    return 1\n    print(\"Itt vagyok\")\n\nprint(f())","opts":["1","Itt vagyok\n1","1\nItt vagyok","None"],"a":0,"why":"A return azonnal befejezi a függvényt, az utána lévő sor sosem fut le.","run":true,"inp":[],"mono":true,"namecheck":null,"evaltype":false},{"t":"choice","q":"Mit ír ki?","code":"def paros(n):\n    return n % 2 == 0\n\nprint(paros(6), paros(7))","opts":["True False","False True","0 1","6 7"],"a":0,"why":"A függvény egy összehasonlítás eredményét, True vagy False értéket ad vissza.","run":true,"inp":[],"mono":true,"namecheck":null,"evaltype":false},{"t":"fill","q":"Egészítsd ki, hogy 25-öt írjon ki!","code":"def negyzet(x):\n    ___ x * x\n\nprint(negyzet(5))","opts":["return","print","x ="],"a":0,"out":"25","why":"A return adja vissza az eredményt. A print csak kiírná, a függvény értéke None lenne, így a végén a None is megjelenne.","inp":[]},{"t":"choice","q":"Mit ír ki?","code":"def atlag(a, b):\n    return (a + b) / 2\n\nprint(atlag(3, 4))","opts":["3.5","3","7",{"err":"Hibát ad"}],"a":0,"why":"(3 + 4) / 2 = 3.5. A / mindig tizedes számot ad.","run":true,"inp":[],"mono":true,"namecheck":null,"evaltype":false},{"t":"build","q":"Rakd össze: add vissza az a és b összegét!","tiles":["return","a","+","b"],"extra":["print(",")"],"check":"def f(a, b):\n    return a + b","why":"A return után áll a kifejezés, aminek az értékét visszaadjuk.","out":null},{"t":"bug","q":"Melyik sor miatt ír ki None-t is a program?","lines":["def dupla(x):","    print(x * 2)","print(dupla(3))"],"a":1,"why":"A függvény kiírja a 6-ot, de nem adja vissza. Ezért a külső print még egy None-t is kiír. Javítás: return x * 2.","inp":[],"err":null,"norun":false}]},{"id":"l29","unit":"u11","title":"Alapértékek és hatókör","icon":"scope","tips":[{"title":"Alapértelmezett paraméter","body":"A paraméternek adhatsz alapértéket: ha híváskor nem adsz meg hozzá értéket, ezt használja. Híváskor a paramétert név szerint is megadhatod, például `koszon(\"Dóra\", udv=\"Helló\")`.","code":"def koszon(nev, udv=\"Szia\"):\n    print(udv, nev)\n\nkoszon(\"Dóra\")\nkoszon(\"Dóra\", \"Helló\")","inp":[],"note":null,"out":"Szia Dóra\nHelló Dóra"},{"title":"Helyi változók","body":"A függvényen belül létrehozott változó **helyi**: csak a függvényen belül létezik. Kívülről nem éred el, és nem írja felül a kinti, azonos nevű változót.","code":"x = 10\ndef f():\n    x = 5\n    print(x)\n\nf()\nprint(x)","inp":[],"note":null,"out":"5\n10"}],"ex":[{"t":"choice","q":"Mit ír ki?","code":"def hatvany(a, n=2):\n    return a ** n\n\nprint(hatvany(3), hatvany(2, 3))","opts":["9 8","6 6","9 9",{"err":"Hibát ad"}],"a":0,"why":"Az első hívásnál n az alapérték, 2: 3² = 9. A másodiknál n = 3: 2³ = 8.","run":true,"inp":[],"mono":true,"namecheck":null,"evaltype":false},{"t":"choice","q":"Mit ír ki?","code":"x = 1\ndef f():\n    x = 99\n\nf()\nprint(x)","opts":["1","99","None",{"err":"Hibát ad"}],"a":0,"why":"A függvényben létrehozott x helyi változó, a kinti x értéke 1 marad.","run":true,"inp":[],"mono":true,"namecheck":null,"evaltype":false},{"t":"choice","q":"Mit ír ki?","code":"def f():\n    y = 7\n\nf()\nprint(y)","opts":[{"err":"Hibát ad (NameError)"},"7","None","0"],"a":0,"why":"Az y csak a függvényen belül létezik, kívülről nem érhető el.","run":true,"inp":[],"mono":true,"namecheck":null,"evaltype":false},{"t":"type","q":"Mit ír ki?","code":"def ar(db, egysegar=150):\n    return db * egysegar\n\nprint(ar(4))","a":["600"],"why":"Az egységár az alapérték, 150: 4 · 150 = 600.","run":true,"inp":[],"evaltype":null,"ph":"Írd be a választ"},{"t":"choice","q":"Mit ír ki?","code":"szorzo = 3\ndef f(x):\n    return x * szorzo\n\nprint(f(5))","opts":["15","5",{"err":"Hibát ad"},"8"],"a":0,"why":"A függvény olvashatja a kinti változót: 5 · 3 = 15.","run":true,"inp":[],"mono":true,"namecheck":null,"evaltype":false},{"t":"fill","q":"Egészítsd ki, hogy Helló Világ legyen a kimenet!","code":"def udvozol(kit, szo=___):\n    print(szo, kit)\n\nudvozol(\"Világ\")","opts":["\"Helló\"","Helló","\"Világ\""],"a":0,"out":"Helló Világ","why":"Az alapérték is egy szöveg, ezért idézőjelbe kell tenni.","inp":[]},{"t":"choice","q":"Mit ír ki?","code":"def f(a, b=1, c=2):\n    print(a + b + c)\n\nf(10, c=5)","opts":["16","13","17",{"err":"Hibát ad"}],"a":0,"why":"a = 10, b az alapérték, 1, a c-t névvel adtuk meg: 5. 10 + 1 + 5 = 16.","run":true,"inp":[],"mono":true,"namecheck":null,"evaltype":false},{"t":"bug","q":"Melyik sorban van a hiba?","lines":["def f(a=1, b):","    return a + b","print(f(2, 3))"],"a":0,"why":"Alapértékes paraméter után nem jöhet alapérték nélküli. Helyesen: def f(b, a=1).","inp":[],"err":"SyntaxError","norun":false}]},{"id":"l30","unit":"u12","title":"Összegzés és megszámolás","icon":"sum","tips":[{"title":"Programozási tételek","body":"A **programo   const NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "html") n.innerHTML = v;
      else if (k === "style") n.style.cssText = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) {
      if (k == null || k === false) continue;
      n.append(k.nodeType ? k : document.createTextNode(String(k)));
    }
    return n;
  }

    const re = /(#[^\n]*)|((?:f(?=["']))?(?:"(?:[^"\\\n]|\\.)*"?|'(?:[^'\\\n]|\\.)*'?))|(\d[\d_]*(?:\.\d+)?(?:e\d+)?|\.\d+)|([A-Za-z_À-ſ][\wÀ-ſ]*)|([\s\S])/g;
    let out = "", m;
    while ((m = re.exec(src))) {
      const t = esc(m[0]);
      if (m[1]) out += '<span class="c-com">' + t + "</span>";
      else if (m[2]) out += '<span class="c-str">' + t + "</span>";

    const max = Math.max(state.goal, ...days.map((d) => d.xp));

    let svg = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Az elmúlt 7 nap XP-je">';
    const gy = y(state.goal);
    svg += '<line x1="' + pad + '" x2="' + (W - pad) + '" y1="' + gy + '" y2="' + gy + '" stroke="var(--sun)" stroke-width="2" stroke-dasharray="5 5"/>';
    svg += '<text x="' + (W - pad) + '" y="' + (gy - 5) + '" text-anchor="end">Napi cél · ' + state.goal + '</text>';
    days.forEach((d, i) => {
      const x = pad + i * bw + bw * 0.18, w = bw * 0.64, top = y(d.xp), isT = d.k === today();
      const fill = state.frozen.includes(d.k) ? "var(--ice)" : isT ? "var(--sun)" : "var(--brand)";

  function examPool(ls, count) {
    const byLesson = shuffle(ls.filter((l) => l.ex.length).map((l) => shuffle(l.ex)));
    const picked = byLesson.slice(0, count).map((a) => a[0]);
    const rest = shuffle(byLesson.flatMap((a, i) => (i < count ? a.slice(1) : a)));
    while (picked.length < count && rest.length) picked.push(rest.pop());
    return shuffle(picked);

  function exBuild(ex) {
